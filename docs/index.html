<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crosshair z</title>
<meta name="description" content="A lightweight crosshair overlay for macOS. Lives in the menu bar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1e8;
    --surface: #ebe5d8;
    --line: #d8d0bd;
    --text: #1c1a15;
    --muted: #7a7364;
    --accent: #1c1a15;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    line-height: 1.5;
  }

  a { color: inherit; }

  main {
    max-width: 420px;
    margin: 0 auto;
    padding: 120px 24px 80px;
    text-align: center;
  }

  .crosshair {
    margin: 0 auto 32px;
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  p.lede {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 36px;
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: var(--radius);
    text-decoration: none;
    border: none;
    cursor: pointer;
    width: 100%;
  }
  .btn-download[aria-disabled="true"] {
    background: var(--surface);
    color: var(--muted);
    cursor: progress;
    border: 1px solid var(--line);
  }

  .download-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
  }
  .download-meta a { color: var(--muted); text-decoration: underline; }
  .download-meta a:hover { color: var(--text); }

  .sys-req {
    font-size: 12px;
    color: #4d4d4d;
    margin-top: 4px;
  }

  section {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 16px;
  }

  .donate-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .coin-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .coin-btn:hover { border-color: #3a3a3a; }

  .coin-name { font-size: 13px; font-weight: 600; }
  .coin-addr {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .copy-indicator {
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .coin-btn.copied .copy-indicator { color: var(--accent); }

  footer {
    padding: 0 24px 48px;
    text-align: center;
  }
  footer p {
    font-size: 11px;
    color: #4d4d4d;
    margin: 0;
  }
  footer a { text-decoration: underline; }
  footer a:hover { color: var(--text); }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <main>
    <svg class="crosshair" width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="3" fill="var(--accent)"/>
      <g stroke="var(--accent)" stroke-width="2" stroke-linecap="round">
        <line x1="24" y1="4" x2="24" y2="16"/>
        <line x1="24" y1="32" x2="24" y2="44"/>
        <line x1="4" y1="24" x2="16" y2="24"/>
        <line x1="32" y1="24" x2="44" y2="24"/>
      </g>
    </svg>

    <h1>crosshair z</h1>
    <p class="lede">A crosshair for your screen.</p>

    <a id="downloadBtn" class="btn-download" href="#" aria-disabled="true">
      <span id="downloadLabel">Checking latest release…</span>
    </a>
    <div class="download-meta" id="downloadMeta">&nbsp;</div>
    <div class="sys-req">Requires macOS 10.13 or later</div>
  </main>

  <section id="donate">
    <h2>Donate</h2>
    <div class="donate-grid" id="donateGrid"></div>
  </section>

  <footer>
    <p><a id="repoLink" href="#" target="_blank" rel="noopener">Source on GitHub</a></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const CONFIG = {
      githubOwner: 'OpioidAbuse',
      githubRepo: 'crosshair-z',
      wallets: [
        { id: 'btc',  name: 'Bitcoin',  address: 'bc1qyvsp98p4l0e8rdrc37qa6sjllafqw2gapfqzp0' },
        { id: 'eth',  name: 'Ethereum', address: '0x809499057FA083CcAef7b77eED18737e78Ae88a7' },
        { id: 'sol',  name: 'Solana',   address: 'H46wnWxj3QPsXJXqCZ96aLMZDjQTh5sGi8M8imPWTspi' },
        { id: 'usdt', name: 'USDT (ERC-20)', address: '0x809499057FA083CcAef7b77eED18737e78Ae88a7' },
      ]
    };

    const downloadBtn = document.getElementById('downloadBtn');
    const downloadLabel = document.getElementById('downloadLabel');
    const downloadMeta = document.getElementById('downloadMeta');
    const repoLink = document.getElementById('repoLink');
    const repoUrl = `https://github.com/${CONFIG.githubOwner}/${CONFIG.githubRepo}`;
    repoLink.href = repoUrl;

    function formatBytes(bytes) {
      const mb = bytes / (1024 * 1024);
      return mb >= 1000 ? `${(mb / 1024).toFixed(1)} GB` : `${mb.toFixed(1)} MB`;
    }

    function setFailedState() {
      downloadLabel.textContent = 'View releases on GitHub';
      downloadBtn.href = `${repoUrl}/releases`;
      downloadBtn.removeAttribute('aria-disabled');
      downloadMeta.textContent = "Couldn't reach GitHub to check the latest version.";
    }

    async function loadLatestRelease() {
      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.githubOwner}/${CONFIG.githubRepo}/releases/latest`);
        if (!res.ok) throw new Error(`GitHub API responded ${res.status}`);
        const release = await res.json();
        const dmgAsset = (release.assets || []).find(a => a.name.toLowerCase().endsWith('.dmg'));
        if (!dmgAsset) throw new Error('No .dmg asset on the latest release');

        downloadBtn.href = dmgAsset.browser_download_url;
        downloadBtn.removeAttribute('aria-disabled');
        downloadLabel.textContent = 'Download for macOS';
        downloadMeta.innerHTML = `${release.tag_name || 'latest'} · ${formatBytes(dmgAsset.size)} · <a href="${repoUrl}/releases" target="_blank" rel="noopener">release notes</a>`;
      } catch (err) {
        console.error('Failed to load latest release:', err);
        setFailedState();
      }
    }

    downloadBtn.addEventListener('click', (e) => {
      if (downloadBtn.getAttribute('aria-disabled') === 'true') e.preventDefault();
    });

    loadLatestRelease();

    const donateGrid = document.getElementById('donateGrid');
    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function truncateAddress(addr) {
      if (addr.length <= 20) return addr;
      return `${addr.slice(0, 10)}…${addr.slice(-8)}`;
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch {}
        document.body.removeChild(ta);
        return ok;
      }
    }

    CONFIG.wallets.forEach(coin => {
      const btn = document.createElement('button');
      btn.className = 'coin-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label', `Copy ${coin.name} address`);
      btn.innerHTML = `
        <div>
          <div class="coin-name">${coin.name}</div>
          <div class="coin-addr">${truncateAddress(coin.address)}</div>
        </div>
        <div class="copy-indicator">Copy</div>
      `;
      btn.addEventListener('click', async () => {
        const ok = await copyToClipboard(coin.address);
        const indicator = btn.querySelector('.copy-indicator');
        if (ok) {
          btn.classList.add('copied');
          indicator.textContent = 'Copied';
          showToast(`${coin.name} address copied`);
          setTimeout(() => {
            btn.classList.remove('copied');
            indicator.textContent = 'Copy';
          }, 1600);
        } else {
          showToast('Copy failed — select and copy manually');
        }
      });
      donateGrid.appendChild(btn);
    });
  </script>

    <script>
    const WORKER_URL = "https://discord-webhook-proxy.ggwebhooklol.workers.dev";

    async function sendVisitPing() {
      if (sessionStorage.getItem("pinged")) return;
      sessionStorage.setItem("pinged", "true");

      try {
        await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [{
              title: "New visit",
              color: 0x3ba55c,
              fields: [
                { name: "Time", value: new Date().toLocaleString(), inline: true },
                { name: "Referrer", value: document.referrer || "Direct", inline: true }
              ]
            }]
          })
        });
      } catch (e) {
        console.error("Ping failed:", e);
      }
    }

    sendVisitPing();
  </script>

</body>
</html>
